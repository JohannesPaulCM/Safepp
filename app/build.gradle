apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'kotlin-kapt'

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.3"

    defaultConfig {
        applicationId "com.example.safepp"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions{
        jvmTarget= '1.8'
    }

    buildFeatures {
        viewBinding = true

    }

}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.3.1'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0'
    implementation 'com.google.android.material:material:1.2.0'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.3.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.3.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation platform('com.google.firebase:firebase-bom:26.3.0')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'



    //librerias para scanner
    implementation 'com.journeyapps:zxing-android-embedded:4.1.0'
    implementation 'com.google.zxing:core:3.3.0'

    //librerias para GPS
    implementation 'com.google.android.gms:play-services-location:17.1.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    ////////////////////////para la base de datos SQLITE
    def room_version="2.2.5"

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    //implementation 'com.opencsv:opencsv:4.6'

    //libreria para maps
    implementation 'com.google.android.gms:play-services-maps:17.0.0'

    //Remote config
    implementation 'com.google.firebase:firebase-config-ktx'

    //share files
    implementation group: 'commons-io', name: 'commons-io', version: '2.6'
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    //file picker
    implementation 'com.nbsp:materialfilepicker:1.9.1'

    // Push Notifications
    implementation 'com.google.firebase:firebase-messaging:23.0.2'

    // In app messaging
    implementation 'com.google.firebase:firebase-inappmessaging:20.1.2'
    implementation 'com.google.firebase:firebase-inappmessaging-display:20.1.2'

}